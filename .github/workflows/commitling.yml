name: Commit Message Validation

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          echo "Validating commits..."

          git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s" | while read commit; do
            echo "----------------------------------------"
            echo "Checking commit:"
            echo "$commit"
            echo "----------------------------------------"

            if [[ ! $commit =~ ^(feat|fix|docs|style|refactor|test|chore|ci|build)(\([a-zA-Z0-9_-]+\))?:\ .+ ]]; then
              echo "❌ Invalid commit message detected!"
              echo "Commit:"
              echo "$commit"
              echo ""
              echo "Expected format:"
              echo "  type(scope): description"
              echo "  OR"
              echo "  type: description"
              echo ""
              echo "Allowed types:"
              echo "  feat, fix, docs, style, refactor, test, chore, ci, build"
              exit 1
            fi

            echo "✅ Valid"
          done

          echo "All commit messages are valid"