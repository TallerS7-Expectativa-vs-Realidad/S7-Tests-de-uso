- name: Validate commit messages
  run: |
    echo "Validating commits..."

    errors=0

    git log origin/${{ github.base_ref }}..HEAD --no-merges --pretty=format:"%h|%s" | while IFS="|" read hash commit; do
      echo "----------------------------------------"
      echo "Checking commit: $hash"
      echo "$commit"
      echo "----------------------------------------"

      if [[ ! $commit =~ ^(feat|fix|docs|style|refactor|test|chore|ci|build)(\([a-zA-Z0-9_-]+\))?:\ .+ ]]; then
        echo "❌ Invalid commit message"
        echo "Commit ID: $hash"
        echo "Message: $commit"
        echo ""
        errors=$((errors+1))
      else
        echo "✅ Valid"
      fi
    done

    echo "----------------------------------------"

    if [ $errors -ne 0 ]; then
      echo "❌ Found $errors invalid commit(s)"
      exit 1
    else
      echo "✅ All commit messages are valid"
    fi